<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARD RESET FAILED — Inferno Comcast</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0d0d;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .hero-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.5rem;
            color: #8b0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .sub-title {
            color: #ff4500;
            font-size: 1rem;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .fail-box {
            background-color: #141414;
            border: 2px solid #8b0000;
            padding: 20px;
            max-width: 480px;
            margin: 20px auto;
            color: #ffaa80;
            font-size: 1.05rem;
            line-height: 1.4;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.4);
        }

        .footer-note {
            font-size: 0.8rem;
            color: #666;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="hero-title">HARD RESET FAILED</div>
    <div class="sub-title">(Predictably.)</div>

    <div class="fail-box">
        <span id="fail-message"></span>
    </div>

    <div class="footer-note">
        Wi-Fi speed restricted to 1.9 Mbps for all eternity.<br>
        All roads lead to RE Hard Reset.
    </div>

    <script>
        const shortFailMessages = [
            "ERROR: You guessed wrong. Your router is now an expensive paperweight.",
            "MATH FAIL: You held the paperclip for the wrong duration. Wi-Fi remains dead.",
            "INCORRECT SECONDS: Support Bot HELLP is laughing at your calculation.",
            "RESET VOIDED: You unsealed the envelope without counting. Absolute chaos.",
            "PAPERCLIP MISFIRE: Enjoy 1.9 Mbps buffering speed for the next 100 years.",
            "SYSTEM CRASH: Nice try, but the void rejected your timing. Try again.",
            "WRONG TIME: You missed the precise second mark. Warranty officially void.",
            "BUFFERING FOREVER: Hold duration incorrect. Re-calculate or live without internet.",
            "ATTEMPT DENIED: You guessed instead of calculating. The router knows.",
            "SIGNAL LOST: Reset protocol collapsed into the abyss. Back to stage one!"
        ];

        document.getElementById('fail-message').innerText = 
            shortFailMessages[Math.floor(Math.random() * shortFailMessages.length)];
    </script>
</body>
</html>
